name: CI

# Runs on pushes to main and on every pull request (rename the branch below
# if yours differs), and can be triggered by hand from the Actions tab.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# CI only needs to read the code, so give the token nothing more.
permissions:
  contents: read

# Cancel a superseded run of the same PR/branch, but never a run on main.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      # The default Linux torch wheel bundles multi-GB CUDA libraries; CI only
      # needs CPU. sentence-transformers then sees torch as already installed.
      - name: Install CPU-only PyTorch
        run: pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      # No API keys or secrets needed: every LLM, retriever, and model call in
      # the tests is mocked, so this is also safe to run on PRs from forks.
      - name: Run tests
        run: python -m pytest tests/ -v

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build image
        run: docker build -t agentic-rag-langgraph .

      # Catches missing or broken dependencies inside the image itself. Graph
      # construction never creates an LLM client, so no API keys are needed.
      - name: Smoke test (imports resolve and the graph compiles)
        run: >
          docker run --rm agentic-rag-langgraph
          -c "from src.graph import build_graph; build_graph(); print('graph compiled')"
